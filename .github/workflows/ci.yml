name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: vocalocart-nextjs

# Dummy value so `prisma generate` and `tsc` have a DATABASE_URL to read at
# config-load time — no real database connection is made by lint/typecheck.
env:
  DATABASE_URL: postgresql://user:password@localhost:5432/vocalocart

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vocalocart-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
